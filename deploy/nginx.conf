# /etc/nginx/sites-available/zooplaneta.uz  (certificates: certbot --nginx -d zooplaneta.uz -d www.zooplaneta.uz)
server {
    listen 80;
    server_name zooplaneta.uz www.zooplaneta.uz;
    return 301 https://zooplaneta.uz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zooplaneta.uz;
    client_max_body_size 20m;

    # uploaded images and CVs live in the docker volume "media"
    location /media/ {
        alias /srv/zooplaneta/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
