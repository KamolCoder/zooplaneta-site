<div class="field{% if field.errors %} has-error{% endif %}{% if full %} full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
